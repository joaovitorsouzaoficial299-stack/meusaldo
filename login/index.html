<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101117"><title>Entrar | MeuSaldo</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg"><link rel="stylesheet" href="/auth/auth.css"></head><body data-mode="login" class="login-reference"><button type="button" class="login-theme-toggle" id="login-theme-toggle" aria-label="Alternar modo claro e escuro" title="Alternar modo claro e escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5 9 9 0 1 0 20.5 15.5Z"/></svg></button><main class="login-wrap"><div class="login-icon"><img src="/icon.svg" alt="Ícone MeuSaldo"></div><h1>MeuSaldo</h1><p class="login-subtitle">Sign in to continue</p><form class="login-form"><label class="login-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="email" name="email" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail" required></label><label class="login-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required><button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></label><div class="login-options"><label class="remember"><input type="checkbox" id="remember" checked><span>Manter conectado</span></label><a href="/recuperar-senha/">Esqueci minha senha</a></div><button type="submit" class="login-submit"><span>Entrar</span><span class="login-arrow" aria-hidden="true">→</span></button><div id="message" role="status" aria-live="polite"></div></form><p class="login-register">Ainda não tem uma conta? <a href="/cadastro/">Cadastrar conta</a></p></main><script type="module" src="/auth/auth.js"></script><script>const themeButton=document.getElementById('login-theme-toggle');const applyTheme=t=>{document.body.classList.toggle('login-dark',t==='dark');themeButton.setAttribute('aria-label',t==='dark'?'Ativar modo claro':'Ativar modo escuro')};applyTheme(localStorage.getItem('meusaldo_login_theme')||'light');themeButton.addEventListener('click',()=>{const t=document.body.classList.contains('login-dark')?'light':'dark';localStorage.setItem('meusaldo_login_theme',t);applyTheme(t)});</script></body></html>
