let step=-1,selected=null,answers=[],confirmed=false;const el=document.getElementById('content');const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function result(){const pain=answers[1],habit=answers[3];const titles=['Seu dinheiro acaba antes do mês? Entenda para onde ele está indo.','Muitas contas e pouco espaço para respirar?','Quer guardar dinheiro, mas nunca sobra?'];const desc=['Veja o que entra, o que sai e o que ainda precisa pagar, antes de decidir o próximo gasto.','Organize vencimentos e simule quais contas cabem no salário e no vale.','Descubra quanto do orçamento já está comprometido e planeje os próximos passos.'];paint('<div class="diagnosis-head"><div class="eyebrow">SEU DIAGNÓSTICO</div><h1>'+safe(titles[pain])+'</h1><p>'+safe(desc[pain])+'</p></div><div class="result"><div class="eyebrow">POR QUE USAR O MEUSALDO?</div><h2>Saiba o que pagar primeiro e quanto pode gastar.</h2><p>Reúna suas contas, acompanhe entradas e saídas e planeje os pagamentos do mês sem depender de planilhas.</p></div><div class="plans" style="grid-template-columns:minmax(0,1fr);max-width:430px;margin:18px auto"><article class="plan recommended"><div class="tag">PLANO BÁSICO</div><h3>MeuSaldo Básico</h3><div class="price">R$ 14,99 <small>/mês</small></div><ul class="features"><li>Planejamento de salário, vale e contas</li><li>Controle de entradas e saídas</li><li>Vencimentos e dívidas organizados</li></ul><button id="essential">Conhecer o MeuSaldo</button></article></div><div class="notice">Assinaturas ainda não disponíveis. Nenhuma cobrança será feita aqui.</div><div class="diagnosis-extra"><h2>Perguntas frequentes</h2><div class="faq"><details><summary>Preciso entender de finanças para usar?</summary><p>Não. A ideia é registrar suas entradas, saídas e contas de forma simples, sem precisar de planilhas.</p></details><details><summary>Posso organizar contas que ainda não paguei?</summary><p>Sim. Você pode cadastrar contas pendentes, acompanhar vencimentos e planejar os pagamentos do mês.</p></details><details><summary>Consigo usar pelo celular?</summary><p>Sim. O MeuSaldo foi pensado para funcionar também no navegador do
