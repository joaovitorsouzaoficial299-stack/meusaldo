<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>MeuSaldo | Seu dinheiro com mais clareza</title><meta name="description" content="Descubra em 2 minutos como dar o primeiro passo para organizar seu dinheiro."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:'DM Sans',sans-serif;color:#f6f1e9;background:#0b0b10;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse 80% 50% at 50% -10%,#55403470,transparent),radial-gradient(ellipse 70% 50% at 100% 100%,#342e3770,transparent),#0b0b10}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #f3d3a1;outline-offset:3px}button:disabled{opacity:.38;cursor:not-allowed}.wrap{width:min(100% - 36px,610px);margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:26px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font:800 24px Manrope;letter-spacing:-1.6px;color:#fff}.brand span{color:#d9b78c}.secure{font-size:11px;color:#a8a0a0;display:flex;align-items:center;gap:6px}.secure svg{width:14px;height:14px}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;animation:rise .38s ease both;padding:28px 0 12px}@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#d6ae7e;text-transform:uppercase;margin:0 0 16px}h1{font:800 clamp(31px,7.7vw,49px)/1.13 Manrope;letter-spacing:-1.8px;margin:0 0 17px}h1 em{font-style:normal;color:#e0bd8c}p{line-height:1.65;color:#b9b0ad;margin:0 0 22px;font-size:15px}.small{font-size:12px;color:#99918e}.cta{width:100%;min-height:58px;border:0;border-radius:15px;background:linear-gradient(115deg,#f2d6a9,#cda171);color:#221914;font-weight:800;box-shadow:0 10px 28px #cda1712b;transition:transform .18s,filter .18s}.cta:hover{filter:brightness(1.06)}.cta:active{transform:scale(.98)}.ghost{border:0;background:none;color:#a9a0a0;padding:14px}.mini{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 30px}.mini span{font-size:12px;color:#d5cbc2}.mini b{color:#e4c193}.progress{margin:26px 0 24px}.progress-top{display:flex;justify-content:space-between;color:#b4a8a0;font-size:12px;margin-bottom:12px}.track{height:5px;border-radius:99px;background:#353137;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ba8c5b,#f0d1a1);border-radius:99px;transition:width .35s}.question{font:800 clamp(25px,6vw,35px)/1.2 Manrope;letter-spacing:-1px;margin:0 0 13px}.options{display:grid;gap:11px;margin:13px 0 28px}.option{display:flex;align-items:center;gap:14px;min-height:69px;text-align:left;border:1px solid #ffffff24;background:linear-gradient(130deg,#ffffff10,#ffffff04);border-radius:17px;color:#e7e0db;padding:16px;transition:background .2s,border .2s,transform .2s}.option:hover{border-color:#cfa77780}.option.selected{border-color:#e6bf8c;background:#d9b78c1b}.dot{width:21px;height:21px;flex:none;border-radius:50%;border:1.5px solid #8e8380;display:grid;place-items:center}.selected .dot{border-color:#e4bc87}.selected .dot:after{content:'';width:11px;height:11px;border-radius:50%;background:#e4bc87}.option span:last-child{font-size:14px;font-weight:600;line-height:1.45}.footer{color:#807b7e;text-align:center;font-size:11px;padding-top:22px}.confirmation{display:flex;align-items:center;gap:14px;padding:17px;border:1px solid #d9b78c44;border-radius:17px;background:#d9b78c12;margin:8px 0 25px;animation:rise .25s}.check{width:43px;height:43px;display:grid;place-items:center;border-radius:50%;background:#d9b78c;color:#201710;font-size:24px;font-weight:800;animation:pop .35s cubic-bezier(.2,1.7,.4,1)}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}.confirmation strong{display:block;font-size:15px}.confirmation small{display:block;margin-top:5px;color:#b7ada6;font-size:12px}.result{border:1px solid #e1bc8d44;border-radius:22px;padding:24px;background:linear-gradient(145deg,#4d3b3450,#ffffff07);margin:10px 0 20px}.result h2{font:800 24px/1.2 Manrope;letter-spacing:-.7px;margin:0 0 13px}.result p{font-size:14px;margin:0}.steps{display:grid;gap:12px;margin:12px 0 25px}.step{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#ded2c8}.step i{font-style:normal;color:#e4be8c}.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 24px}.plan{border:1px solid #ffffff25;border-radius:19px;padding:19px 14px;background:#ffffff0a;display:flex;flex-direction:column;gap:10px}.plan.recommended{border-color:#e3ba83;background:#d9b78c15;box-shadow:0 0 32px #d9b78c12}.plan .tag{color:#e8bf8b;font-size:10px;font-weight:800;letter-spacing:.5px;min-height:14px}.plan h3{margin:0;font:800 18px Manrope}.price{font:800 26px Manrope;letter-spacing:-1px}.price small{font:400 11px 'DM Sans';color:#b5aaa4}.plan p{font-size:12px;line-height:1.5;margin:0}.features{list-style:none;padding:0;margin:5px 0 15px;display:grid;gap:10px;flex:1}.features li{font-size:12px;color:#d5cac1;line-height:1.45}.features li:before{content:'✓';color:#e4bd8b;margin-right:7px}.plan button{width:100%;padding:13px 5px;border:1px solid #d7b384;border-radius:11px;background:#e4c08d;color:#241912;font-weight:800;font-size:12px}.plan:not(.recommended) button{background:transparent;color:#e4c08d}.notice{border:1px solid #ffffff25;border-radius:14px;padding:14px;color:#bdb3ad;font-size:12px;line-height:1.6;margin-bottom:20px}.link{color:#e4bd8b;text-decoration:underline;text-underline-offset:3px}.center{text-align:center}.hide{display:none!important}@media(max-width:380px){.wrap{width:calc(100% - 28px)}.plan{padding:16px 10px}.price{font-size:23px}.plan h3{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.question-photo{position:relative;width:100%;height:clamp(145px,24vw,205px);overflow:hidden;border-radius:18px;margin:0 0 22px;background:linear-gradient(120deg,#332b26,#151416);border:1px solid #e3bc8d30;box-shadow:0 12px 32px #0003}.question-photo img{width:100%;height:100%;object-fit:cover;object-position:center 48%;display:block;filter:saturate(.83) contrast(1.04);animation:photoEnter .45s ease both}.question-photo .photo-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#0b0b1060,transparent 62%),linear-gradient(90deg,#17110f22,transparent)}@keyframes photoEnter{from{opacity:.4;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.question-photo{height:150px;margin-bottom:17px;border-radius:14px}.progress{margin:16px 0 17px}.screen{justify-content:flex-start;padding-top:12px}.options{margin-bottom:17px}.option{min-height:60px;padding:12px 14px}.question{font-size:clamp(23px,6vw,31px)}}@media(prefers-reduced-motion:reduce){.question-photo img{animation:none}}.answer-hint{font-size:11px;line-height:1.4;color:#8f8987;margin:0 0 12px}@media(max-width:600px){.answer-hint{font-size:10px;margin-bottom:9px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">meu<span>saldo.</span></div></header><div id="content" class="screen"></div><footer class="footer">MeuSaldo · Organização financeira sem complicação.</footer></main>
<script>
const questions=[
{title:'Quando o dinheiro cai na conta, você sente que ele desaparece rápido demais?',options:['Sim. Às vezes nem sei onde foi parar.','Às vezes. Consigo pagar as contas, mas sobra pouco.','Não tanto, mas quero me organizar melhor.'],type:'control'},
{title:'Qual dessas situações mais tira sua tranquilidade?',options:['Chegar no fim do mês sem dinheiro.','Ter contas e dívidas para pagar.','Não conseguir guardar nada para o futuro.'],type:'pain'},
{title:'Se aparecesse uma despesa inesperada amanhã, como você se sentiria?',options:['Preocupado(a). Não tenho uma reserva.','Precisaria reorganizar minhas contas.','Conseguiria lidar, mas quero mais segurança.'],type:'security'},
{title:'O que mais te impede de acompanhar seus gastos?',options:['Esqueço de anotar no dia a dia.','Acho planilhas e controles complicados.','Ainda não encontrei um jeito prático.'],type:'habit'},
{title:'Imagine olhar para seu dinheiro e saber exatamente o que pode gastar. O que isso mudaria?',options:['Teria mais paz para dormir e planejar.','Conseguiria me preparar para sair das dívidas.','Poderia começar a construir minha liberdade financeira.'],type:'goal'}
];
const questionPhotos=[["photo-1554224155-6726b3ff858f","Pessoa conferindo contas e despesas com calculadora"],["photo-1772588627327-1eeddcf73c11","Pessoa organizando documentos e orçamento doméstico"],["photo-1710492341412-8b3aee7e70a6","Calculadora e papéis representando uma despesa inesperada"],["photo-1732437598333-27141529981f","Pessoa conferindo dinheiro e calculadora"],["photo-1758691031749-607d43c14f63","Casal organizando as finanças e celebrando com tranquilidade"]];
let step=-1,selected=null,answers=[],confirmed=false;const el=document.getElementById('content');const safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paint(markup){el.style.animation='none';void el.offsetWidth;el.style.animation='';el.innerHTML=markup}
function button(text,id,disabled=false){return '<button type="button" class="cta" id="'+id+'" '+(disabled?'disabled':'')+'>'+text+'</button>'}
function intro(){paint('<div class="eyebrow">Um novo começo para o seu dinheiro</div><h1>Seu dinheiro chega. Mas a <em>tranquilidade</em> fica?</h1><p>Você trabalha, paga contas e faz o possível. Só que às vezes parece que o dinheiro nunca é suficiente. E se o primeiro passo para mudar isso fosse entender melhor para onde ele vai?</p><div class="mini"><span><b>✓</b> 5 perguntas rápidas</span><span><b>✓</b> Diagnóstico personalizado</span><span><b>✓</b> Sem compromisso</span></div>'+button('Descobrir meu próximo passo →','start')+'<p class="small center" style="margin-top:16px">Leva cerca de 1 minuto. Sem pedir dados pessoais.</p>');document.getElementById('start').onclick=()=>{step=0;renderQuestion()}}
function renderQuestion(){const q=questions[step];paint('<div class="progress"><div class="progress-top"><span>Sua vida financeira, suas escolhas</span><span>'+(step+1)+' de '+questions.length+'</span></div><div class="track"><div class="fill" style="width:'+((step+1)/questions.length*100)+'%"></div></div></div><div class="question-photo"><img src="https://images.unsplash.com/'+questionPhotos[step][0]+'?auto=format&fit=crop&w=1100&q=78" alt="'+safe(questionPhotos[step][1])+'" loading="eager" decoding="async"><span class="photo-shade"></span></div><h2 class="question">'+safe(q.title)+'</h2><p class="answer-hint">Escolha a resposta que mais combina com você.</p><div class="options">'+q.options.map((a,i)=>'<button type="button" class="option '+(selected===i?'selected':'')+'" data-option="'+i+'" aria-pressed="'+(selected===i)+'"><span class="dot"></span><span>'+safe(a)+'</span></button>').join('')+'</div>'+button('Próximo →','next',selected===null)+'<button type="button" class="ghost" id="back">← Voltar</button>');el.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.option);confirmed=false;renderQuestion()});document.getElementById('back').onclick=()=>{if(step===0){step=-1;selected=null;intro()}else{step--;selected=answers[step]??null;confirmed=false;renderQuestion()}};document.getElementById('next').onclick=()=>{if(selected===null)return;answers[step]=selected;selected=null;confirmed=false;if(step<questions.length-1){step++;renderQuestion()}else result()}}
function result(){const pain=answers[1],habit=answers[3],goal=answers[4];const titles=['Seu dinheiro precisa de um plano, não de mais preocupação.','Suas contas merecem um lugar só.','Seu futuro começa com pequenas decisões.'];const desc=['Ter clareza das entradas e saídas pode ajudar você a enxergar oportunidades de ajustar o orçamento.','Visualizar os vencimentos e o valor das contas pendentes pode facilitar suas próximas decisões.','Acompanhar gastos e definir prioridades é um bom começo para construir uma reserva no seu ritmo.'];const pro=habit===0;const reason=pro?'Você comentou que costuma esquecer de anotar os gastos. O Pro foi pensado para tornar o registro mais prático pelo WhatsApp.':'Pelas suas respostas, começar pelo controle direto no aplicativo pode ser um ótimo primeiro passo.';paint('<div class="eyebrow">Seu diagnóstico está pronto</div><h1>Você não precisa adivinhar para onde vai seu <em>dinheiro.</em></h1><div class="result"><div class="eyebrow">O QUE SUAS RESPOSTAS INDICAM</div><h2>'+safe(titles[pain])+'</h2><p>'+safe(desc[pain])+'</p></div><p>Você não precisa mudar tudo de uma vez. Comece por três hábitos simples:</p><div class="steps"><div class="step"><i>01.</i><span>Registrar o que entra e o que sai.</span></div><div class="step"><i>02.</i><span>Saber quais contas estão próximas do vencimento.</span></div><div class="step"><i>03.</i><span>Entender quanto sobra antes de assumir novos gastos.</span></div></div><p>O <strong style="color:#f4e5d2">MeuSaldo</strong> reúne essas informações em um lugar só, para você ter mais clareza e tomar decisões com confiança.</p>'+button('Ver meu plano ideal →','plans')+'<p class="small center" style="margin-top:16px">Sem promessas de enriquecimento. Apenas mais organização.</p>');document.getElementById('plans').onclick=()=>plans(pro,reason)}
function plans(pro,reason){paint('<div class="eyebrow">Seu próximo passo</div><h1>Escolha como quer começar a cuidar do seu <em>futuro.</em></h1><p>'+safe(reason)+'</p><div class="plans"><article class="plan '+(!pro?'recommended':'')+'"><div class="tag">'+(!pro?'INDICADO PARA VOCÊ':'CONTROLE PELO APP')+'</div><h3>Essencial</h3><div class="price">R$ 9,90 <small>/mês</small></div><p>Organização financeira de forma simples.</p><ul class="features"><li>Entradas e saídas</li><li>Contas e dívidas</li><li>Dashboard financeiro</li></ul><button id="essential">Escolher Essencial</button></article><article class="plan '+(pro?'recommended':'')+'"><div class="tag">'+(pro?'INDICADO PARA VOCÊ':'MAIS PRATICIDADE')+'</div><h3>Pro</h3><div class="price">R$ 19,90 <small>/mês</small></div><p>Mais facilidade para registrar gastos.</p><ul class="features"><li>Tudo do Essencial</li><li>Registros pelo WhatsApp*</li><li>Categorização automática*</li></ul><button id="pro">Escolher Pro</button></article></div><div class="notice">*Os recursos de WhatsApp do Pro ainda estão em desenvolvimento. Os preços são uma proposta e a contratação ainda não está habilitada. Não há cobrança nesta página.</div><button type="button" class="ghost" id="back-result">← Voltar ao diagnóstico</button>');document.getElementById('essential').onclick=()=>wait('Essencial');document.getElementById('pro').onclick=()=>wait('Pro');document.getElementById('back-result').onclick=result}
function wait(plan){paint('<div class="eyebrow">Você escolheu o plano '+safe(plan)+'</div><h1>Seu próximo passo está <em>quase pronto.</em></h1><p>Estamos preparando o cadastro e o pagamento seguro. Por enquanto, você pode conhecer a interface do MeuSaldo sem realizar nenhuma compra.</p><div class="notice">Esta é uma demonstração da jornada de compra. Nenhuma assinatura foi criada e nenhum pagamento foi realizado.</div><a href="/" class="cta" style="display:grid;place-items:center;text-decoration:none">Conhecer o aplicativo →</a><button type="button" class="ghost" id="back-plans">← Voltar aos planos</button>');document.getElementById('back-plans').onclick=()=>plans(answers[3]===0,answers[3]===0?'Você comentou que costuma esquecer de anotar os gastos. O Pro foi pensado para tornar o registro mais prático pelo WhatsApp.':'Pelas suas respostas, começar pelo controle direto no aplicativo pode ser um ótimo primeiro passo.')}
intro();
</script></body></html>
